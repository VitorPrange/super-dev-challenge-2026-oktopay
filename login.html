<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="okto-guard" content="off">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <title>OKTOPAY · Entrar</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("oktopay-tema"); } catch (e) {}
      if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.paleta = "oceano";
      try {
        if (localStorage.getItem("oktopay-texto") === "grande") document.documentElement.dataset.texto = "grande";
        if (localStorage.getItem("oktopay-mov") === "reduzido") document.documentElement.dataset.mov = "reduzido";
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="auth">
  <section class="cartao auth-card" aria-labelledby="t-auth">
    <div class="auth-marca"><img src="logo.svg" alt="" width="44" height="44"><span>OKTOPAY</span></div>
    <h2 id="t-auth">Entrar na sua conta</h2>
    <p class="sub">Use o e-mail e a senha do seu cadastro.</p>
    <form id="form" novalidate>
      <label class="campo">E-mail<input type="email" id="email" autocomplete="username" required placeholder="voce@email.com"></label>
      <label class="campo">Senha<input type="password" id="senha" autocomplete="current-password" required placeholder="Sua senha"></label>
      <p class="auth-msg" id="msg" role="alert" aria-live="polite"></p>
      <button class="btn" type="submit" id="btn">Entrar</button>
    </form>
    <p class="auth-troca">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </section>
</main>
<script>
  const msg = document.getElementById("msg"), btn = document.getElementById("btn");
  OKTO.sessao().then((s) => { if (s) location.replace("index.html"); });

  function erro(t) { msg.className = "auth-msg erro"; msg.textContent = t; }

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    if (!email || !senha) { erro("Preencha e-mail e senha."); return; }
    btn.disabled = true; msg.className = "auth-msg"; msg.textContent = "Entrando…";
    const { error } = await OKTO.sb.auth.signInWithPassword({ email, password: senha });
    if (error) {
      btn.disabled = false;
      if (/invalid login credentials/i.test(error.message)) erro("E-mail ou senha incorretos, ou esta conta ainda não foi cadastrada.");
      else if (/email not confirmed/i.test(error.message)) erro("Confirme seu e-mail (veja a caixa de entrada) antes de entrar.");
      else erro("Não foi possível entrar: " + error.message);
      return;
    }
    location.replace("index.html");
  });
</script>
</body>
</html>
